name: Build GUI Binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update a GitHub release with the built binaries
        required: false
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease (only used when publish_release is enabled)
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional release tag override (defaults to <package version>)
        required: false
        type: string
      release_name:
        description: Optional release name override (defaults to the resolved tag)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Ubuntu GUI runtime libraries
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install GUI build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[gui,parquet] pyinstaller pillow

      - name: Verify GUI build dependencies
        run: python -c "import PySide6, pyarrow, pandas, rpg; print('GUI build dependencies OK')"

      - name: Build GUI executable
        run: pyinstaller --clean --noconfirm scripts/metaumbra-gui.spec

      - name: Smoke test GUI executable imports
        shell: pwsh
        run: |
          $env:METAUMBRA_GUI_SMOKE_IMPORTS = "1"
          if ("${{ runner.os }}" -eq "Windows") {
            & ".\dist\metaumbra-gui.exe"
          }
          else {
            & "./dist/metaumbra-gui"
          }

      - name: Prepare GUI release asset
        id: prep_asset
        shell: pwsh
        run: |
          $version = (python src/metaumbra/__version__.py).Trim()
          $platform = "${{ runner.os }}".ToLowerInvariant()
          $arch = "${{ runner.arch }}".ToLowerInvariant()

          if ("${{ runner.os }}" -eq "Windows") {
            $sourcePath = Join-Path "dist" "metaumbra-gui.exe"
            $assetName = "metaumbra-gui-v$version-$platform-$arch.exe"
          }
          else {
            $sourcePath = Join-Path "dist" "metaumbra-gui"
            $assetName = "metaumbra-gui-v$version-$platform-$arch"
          }

          $destPath = Join-Path "dist" $assetName
          Copy-Item -LiteralPath $sourcePath -Destination $destPath -Force

          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep_asset.outputs.asset_name }}
          path: dist/${{ steps.prep_asset.outputs.asset_name }}
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag and name
        id: resolve_release
        shell: bash
        run: |
          set -euo pipefail

          version="$(python src/metaumbra/__version__.py | tr -d '\r\n')"
          if [ -z "${version}" ]; then
            echo "Failed to read package version from src/metaumbra/__version__.py" >&2
            exit 1
          fi

          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${version}"
          fi

          if [ -n "${{ inputs.release_name }}" ]; then
            name="${{ inputs.release_name }}"
          else
            name="${tag}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve_release.outputs.tag }}
          name: ${{ steps.resolve_release.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-assets/*
